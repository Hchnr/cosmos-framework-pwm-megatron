[trainer]
max_iter = 100000
logging_iter = 1
grad_accum_iter = 1

[trainer.callbacks.compile_tokenizer]
enabled = true
compile_after_iterations = 3
spatial_sizes = [[480, 848], [720, 640], [640, 752], [480, 720], [848, 640], [640, 640], [480, 640], [960, 640]]
require_full_coverage = true

[trainer.compile_config]
recompile_limit = 128
use_duck_shape = false

[trainer.compile_cache]
enabled = false
path = "${oc.env:ACTION128_COMPILE_CACHE_ROOT,/tmp/cosmos_compile_cache/action128_state_h1_58src}/rank${oc.env:LOCAL_RANK,0}"

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
action128_load_mode = "extend"
action128_preserve_source_normalization = true
megatron_tp_pp_import_path = "${oc.env:MEGATRON_TP_PP_IMPORT_PATH}"
keys_to_skip_loading = []
load_training_state = true
save_iter = 200
keep_last_n = 3
keep_every_n_steps = 2000
dcp_async_mode_enabled = false
keys_not_to_resume = []
strict_resume = true
