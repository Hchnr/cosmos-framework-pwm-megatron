# Unified Action128 WAM with the width-only 1B ACTION tower.
# Normalization is loaded from each published R2 root; video/VAE remain online.
[job]
task = "vfm"
experiment = "action_policy_droid_nano"
project = "cosmos3_action"
group = "action128"
name = "action128_wam_nano"
wandb_mode = "online"

[model]
vision_spatial_position_mode = "action128_seam"
tower_structure = "three_tower"
action_tower_init = "checkpoint"
action_tower_preset = "width_only_1b"
action_tower_execution = "native"
action_tower_attention_backend = "flash3_video"
action_tower_und_short_tokens = 5120
precision = "bfloat16"
action_tower_projection_mode = "routed"
action_gen = true
vlm_tokenizer_path = "${oc.env:HF_MODEL_PATH}"
load_vlm_visual = false
max_num_tokens_after_packing = 74368

[model.ema]
enabled = false

# GEN includes both VIDEO (59648) and ACTION (2944) rows.
[model.fixed_sequence_length]
enabled = true
und_tokens = 11776
gen_tokens = 62592
action_tokens = 2944

[model.compile]
enabled = true
compiled_region = "language"
compile_dynamic = false
mix_order_reduction_split_size = 32

[model.activation_checkpointing]
mode = "full"

[model.parallelism]
data_parallel_shard_degree = 16
data_parallel_replicate_degree = -1
context_parallel_shard_degree = 1

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 0.00002

[scheduler]
cycle_lengths = [1000]
warm_up_steps = [100]
f_start = [0.0]
f_max = [1.0]
f_min = [0.1]

[dataloader_train]
# Action-1B production capacities; token admission determines actual pack size.
max_samples_per_batch = 92
max_sequence_length = 74368
# Joint-loader total budget: one worker for each of the seven sources.
num_workers = 7
prefetch_factor = 1
pin_memory = true
seed = 42

[dataloader_train.visual_generation]
vae_mode = "online"

[dataloader_train.media]
# Some native RoboMIND camera windows exceed the generic 120-second limit.
# Keep bounded decoding and the published sampling semantics unchanged.
decode_timeout_sec = 300
# Share decoding only when timestamp seeks resolve to the same file packet.
reuse_seek_groups = true

[[dataloader_train.datasets]]
path = "/share/project/liyue/data/parquet-data/action128-full-20260922/AgiBotWorld-Beta/AgiBotWorld-Beta.parquet"
ratio = 1

[[dataloader_train.datasets]]
path = "/share/project/liyue/data/parquet-data/action128-full-20260922/Cosmos3-DROID/Cosmos3-DROID.parquet"
ratio = 1

[[dataloader_train.datasets]]
path = "/share/project/liyue/data/parquet-data/action128-full-20260922/Galbot/Galbot.parquet"
ratio = 1

[[dataloader_train.datasets]]
path = "/share/project/liyue/data/parquet-data/action128-full-20260922/RoboMIND-v1/RoboMIND-v1.parquet"
ratio = 1

[[dataloader_train.datasets]]
path = "/share/project/liyue/data/parquet-data/action128-full-20260922/RoboMIND2.0/RoboMIND2.0.parquet"
ratio = 1

[[dataloader_train.datasets]]
path = "/share/project/liyue/data/parquet-data/action128-full-20260922/RoboTwin2.0/RoboTwin2.0.parquet"
ratio = 1

[[dataloader_train.datasets]]
path = "/share/project/liyue/data/parquet-data/action128-full-20260922/libero/libero.parquet"
ratio = 1

[trainer]
max_iter = 1000
logging_iter = 1
grad_accum_iter = 1

[trainer.compile_cache]
enabled = true
path = "${oc.env:ACTION128_COMPILE_CACHE_ROOT,/tmp/cosmos_compile_cache/action128_wam}/rank${oc.env:LOCAL_RANK,0}"

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
# Old base: initialize Action128 heads. Trained Action128: retain heads/contract.
# Explicit reset_heads is allowed only for model-only initialization.
action128_load_mode = "auto"
keys_to_skip_loading = []
strict_resume = true
load_training_state = false
save_iter = 100
