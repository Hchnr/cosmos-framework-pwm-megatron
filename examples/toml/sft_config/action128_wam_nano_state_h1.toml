# User-selected sequence share: 526 / (10000 + 526) = 4.997%.
# Two-second windows, one State token; tactile disabled. Original ratios unchanged.
[[dataloader_train.datasets]]
path = "/share-mixed/projset/eai_pwm/datasets/action_tactile_pretraining_20261026/catalogs/legacy_unified_action128.parquet"
ratio = 526

[trainer]
max_iter = 100000
logging_iter = 1
# 96 GPUs x GA3: 90% of the original 160 GPUs x GA2 batch capacity.
grad_accum_iter = 3

# All unique H/W canvases from Action128 view_layout, not T2V resolution buckets.
# Compile on a shared optimizer boundary; validate latents AND caches on every rank.
[trainer.callbacks.compile_tokenizer]
enabled = true
compile_after_iterations = 3
spatial_sizes = [[480, 848], [720, 640], [640, 752], [480, 720], [848, 640], [640, 640], [480, 640], [960, 640]]
require_full_coverage = true

[trainer.compile_config]
# Retain a safety margin for both UND buckets and other compiled regions.
recompile_limit = 128
use_duck_shape = false

[trainer.compile_cache]
# Keep persistent cache management off while validating static compilation.
enabled = false
path = "${oc.env:ACTION128_COMPILE_CACHE_ROOT,/tmp/cosmos_compile_cache/action128_wam_96gpu}/rank${oc.env:LOCAL_RANK,0}"

[checkpoint]
# CPU staging remains synchronous; move serialization and disk writes off the
# training path. The first save also allocates the reusable pinned staging area.
dcp_async_mode_enabled = true
# Prune only after all ranks finish a successful checkpoint save.
keep_last_n = 3
# Keep step 2000, 4000, ... in addition to the newest three checkpoints.
keep_every_n_steps = 2000
# Load only model weights, including all Action heads, from a trained Action128 DCP.
# Adopt the new normalization contract; optimizer/scheduler/step/cursors start fresh.
# Lineage: pretraining iter17200 -> input head 0 copied to State head 32.
# Keep the original run/config.yaml and use a distinct output directory.
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
action128_load_mode = "warm_start"
keys_to_skip_loading = []
# Initial warm-start rebuilds optimizer and streams. Subsequent auto-resume
# within this run may restore all state when configuration/topology is unchanged.
keys_not_to_resume = []
strict_resume = true
load_training_state = false
save_iter = 200
