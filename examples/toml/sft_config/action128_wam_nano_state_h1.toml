ratio = 1986

[[dataloader_train.datasets]]
path = "/share-mixed/project/liyue/data/parquet-data/action128-full-20261015/InternData-A1-joint/InternData-A1-joint.parquet"
ratio = 1986

[[dataloader_train.datasets]]
path = "/share-mixed/project/liyue/data/parquet-data/action128-full-20261015/InternData-M1-eef/InternData-M1-eef.parquet"
