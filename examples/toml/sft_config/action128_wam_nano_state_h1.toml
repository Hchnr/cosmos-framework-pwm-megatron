[[dataloader_train.datasets]]
path = "/share-mixed/project/liyue/data/parquet-data/action128-full-20261015/RoboMIND2.0-eef/RoboMIND2.0-eef.parquet"
ratio = 244

[[dataloader_train.datasets]]
