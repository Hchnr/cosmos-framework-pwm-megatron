verbosity_interval = 0
warm_up_steps = [
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter         = 2
logging_iter            = 1
max_iter                = 100000

# Disable periodic generation previews for both regular and EMA weights.
[trainer.callbacks.every_n_sample_reg]
every_n      = 0
run_at_start = false

[trainer.callbacks.every_n_sample_ema]
every_n      = 0
run_at_start = false

[trainer.callbacks.compile_tokenizer]
compile_after_iterations = 3
enabled                  = false

[trainer.callbacks.grad_clip]
clip_norm    = 0.1
force_finite = true

[checkpoint]
keys_to_skip_loading = ["net_ema."]
load_path            = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter            = 500

[dataloader_train]
max_sequence_length = 45056
max_caption_tokens  = 2048
seed                = 42
num_workers         = 6
prefetch_factor     = 4
pin_memory          = false

[dataloader_train.media]
# Production catalogs contain legitimate 6K/8K sources. They are decoded to the
# configured training canvas before window materialization.
max_frame_pixels = 33554432

# Force pure T2V when a row does not explicitly override conditioning.
[dataloader_train.visual_generation]
conditioning_config = { 0 = 1.0, 1 = 0.0, 2 = 0.0 }

# Estimated full-data packed-sequence counts are approximately 267,296 and
# 417,625. The 16:25 sequence ratio lets both datasets complete near one pass
# together without trying to equalize their raw row counts. The paired launcher
# pins model.config.resolution=256, matching the geometry used for this estimate.
[[dataloader_train.datasets]]
path  = "${oc.env:ACTION100M_DATASET_PATH}"
ratio = 16

[[dataloader_train.datasets]]
path  = "${oc.env:KOALA_DATASET_PATH}"
ratio = 25
