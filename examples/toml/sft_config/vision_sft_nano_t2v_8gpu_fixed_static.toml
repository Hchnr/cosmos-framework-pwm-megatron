verbosity_interval = 0
warm_up_steps = [
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
    50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter         = 2
logging_iter            = 1
max_iter                = 100000

[trainer.compile_cache]
enabled = true
path    = ".compile_cache/nano_t2v_fixed_static"

# Disable periodic generation previews for both regular and EMA weights.
[trainer.callbacks.every_n_sample_reg]
every_n      = 0
run_at_start = false

[trainer.callbacks.every_n_sample_ema]
every_n      = 0
run_at_start = false

[trainer.callbacks.compile_tokenizer]
compile_after_iterations = 3
enabled                  = true
warmup_resolutions       = ["256"]
aspect_ratio             = "1,1"

[trainer.callbacks.grad_clip]
clip_norm    = 0.1
force_finite = true

[checkpoint]
keys_to_skip_loading = ["net_ema."]
load_path            = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter            = 500

[dataloader_train]
max_sequence_length = 65536
max_caption_tokens  = 2048
seed                = 42
num_workers         = 10
prefetch_factor     = 4
pin_memory          = false

[dataloader_train.media]
max_frame_pixels              = 33554432
safetensors_handle_cache_size = 8
max_latent_tensor_bytes       = 1073741824

[dataloader_train.visual_generation]
vae_mode                   = "online"
expected_vae_name          = "wan2pt2_tokenizer"
expected_vae_weights_sha256 = "${oc.env:WAN_VAE_WEIGHTS_SHA256,20eb789667fa5e60e7516bf509512f6cb61f01b0aa0695eadaea930c13892b36}"
conditioning_config = { 0 = 1.0, 1 = 0.0, 2 = 0.0 }

[[dataloader_train.datasets]]
path              = "${oc.env:ACTION100M_DATASET_PATH}"
ratio             = 16
vae_manifest_path = "${oc.env:ACTION100M_VAE_MANIFEST_PATH,}"

[[dataloader_train.datasets]]
path              = "${oc.env:KOALA_DATASET_PATH}"
ratio             = 25
vae_manifest_path = "${oc.env:KOALA_VAE_MANIFEST_PATH,}"
